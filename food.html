<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ee">
<title>今天吃什么 · mimichong</title>
<style>
  :root{
    --bg:#faf6ee;
    --card:#fffdf9;
    --line:#eae1d3;
    --ink:#231d16;
    --ink-2:#6f6455;
    --ink-3:#a89a86;
    --tomato:#e0512f;
    --tomato-press:#c8431f;
    --green:#1f6f5c;
    --shadow:0 1px 2px rgba(60,42,20,.05), 0 14px 34px -16px rgba(60,42,20,.25);
    --ease-out:cubic-bezier(.22,1,.36,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:22px 16px 28px;
    background-image:radial-gradient(70% 46% at 50% 0%,rgba(224,81,47,.07),transparent 70%);
    min-height:100dvh;
  }
  .shell{width:100%;max-width:430px}

  /* ================= 验证门 ================= */
  .gate{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px 18px;
    background:var(--bg);
    background-image:radial-gradient(70% 46% at 50% 0%,rgba(224,81,47,.07),transparent 70%);
    transition:opacity .34s var(--ease-out), transform .34s var(--ease-out);
  }
  .gate.out{opacity:0;transform:scale(.98);pointer-events:none}
  .gate-card{
    width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);padding:24px 20px 22px;text-align:center;
    transform:translateY(8px);opacity:0;animation:in .45s var(--ease-out) forwards;
  }
  .mark{width:38px;height:38px;border-radius:11px;background:#231d16;display:grid;place-items:center;margin:0 auto 14px}
  .mark svg{width:19px;height:19px}
  .gate-card h1{font-size:18px;font-weight:700;letter-spacing:-.2px}
  .gate-card p{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.6}
  .ts-wrap{display:flex;justify-content:center;margin:20px 0 4px;min-height:66px}
  .gate-status{font-size:12px;color:var(--ink-3);margin-top:8px;min-height:18px}

  /* ================= 主界面 ================= */
  .app{display:none;opacity:0}
  .app.in{display:block;animation:in .5s var(--ease-out) forwards}
  @keyframes in{to{transform:none;opacity:1}}

  header{text-align:center;margin-bottom:16px}
  h1.title{font-size:27px;line-height:1.2;letter-spacing:-.6px;font-weight:800}
  h1.title em{font-style:normal;color:var(--tomato)}
  .sub{margin-top:7px;font-size:13px;color:var(--ink-2)}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:var(--shadow);padding:18px 16px 16px;position:relative;
  }
  .mute{
    position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:10px;
    border:1px solid var(--line);background:#fff;color:var(--ink-2);cursor:pointer;
    display:grid;place-items:center;transition:.2s;z-index:4;
  }
  .mute:hover{border-color:#ddd0bd;color:var(--ink)}
  .mute svg{width:15px;height:15px}

  .wheelbox{position:relative;width:100%;max-width:330px;margin:10px auto 4px}
  .wheelbox svg{display:block;width:100%;height:auto;
    filter:drop-shadow(0 10px 22px rgba(60,42,20,.16))}
  .pointer{
    position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:3;
    width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
    border-top:20px solid var(--tomato);
    filter:drop-shadow(0 3px 4px rgba(60,42,20,.25));
  }
  .hub{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:58px;height:58px;border-radius:50%;background:var(--card);
    border:1px solid var(--line);box-shadow:0 4px 14px rgba(60,42,20,.14);
    display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;
  }

  .spin{
    width:100%;height:52px;border:0;border-radius:15px;background:var(--tomato);color:#fff;
    font-size:16px;font-weight:700;letter-spacing:.3px;cursor:pointer;margin-top:12px;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .3s var(--spring),background .18s,opacity .2s,box-shadow .25s;
    box-shadow:0 8px 20px -8px rgba(224,81,47,.65);
  }
  .spin:hover:not([disabled]){background:var(--tomato-press);transform:translateY(-1px)}
  .spin:active:not([disabled]){transform:scale(.985)}
  .spin[disabled]{opacity:.5;box-shadow:none;cursor:not-allowed}
  .spin svg{width:18px;height:18px}
  .spin .dots{display:none}
  .spin.spinning .dots{display:inline-flex;gap:4px}
  .spin.spinning .icon{display:none}
  .dots i{width:5px;height:5px;border-radius:50%;background:#fff;opacity:.5;animation:blink 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}
  .dots i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

  /* ================= 结果 ================= */
  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;z-index:30;
    background:rgba(35,29,22,.42);backdrop-filter:blur(3px)}
  .modal.on{display:flex;animation:fade .25s var(--ease-out)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .result{
    width:100%;max-width:340px;background:var(--card);border-radius:22px;border:1px solid var(--line);
    box-shadow:0 30px 70px -24px rgba(35,29,22,.5);padding:22px 20px 18px;text-align:center;
    transform:scale(.72);opacity:0;animation:pop .55s var(--spring) .06s forwards;
  }
  @keyframes pop{
    0%{transform:scale(.72) translateY(10px);opacity:0}
    62%{transform:scale(1.045) translateY(0);opacity:1}
    100%{transform:scale(1);opacity:1}
  }
  .shock{
    width:104px;height:104px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px;
    border:3px solid #fff;box-shadow:0 8px 22px -8px rgba(60,42,20,.45);
    transform:scale(.4) rotate(-12deg);opacity:0;animation:jump .62s var(--spring) .18s forwards;
  }
  @keyframes jump{
    0%{transform:scale(.4) rotate(-12deg);opacity:0}
    60%{transform:scale(1.14) rotate(4deg);opacity:1}
    100%{transform:scale(1) rotate(0);opacity:1}
  }
  .result .k{font-size:12px;letter-spacing:.2em;color:var(--ink-3)}
  .result .name{font-size:31px;font-weight:800;letter-spacing:-.6px;margin:6px 0 4px;line-height:1.15}
  .result .hint{font-size:12.5px;color:var(--ink-2);margin-bottom:16px}
  .rbtns{display:flex;gap:9px}
  .rbtns button{flex:1;height:44px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:#fff;color:var(--ink);transition:.2s}
  .rbtns button.primary{background:var(--green);border-color:var(--green);color:#fff}
  .rbtns button:hover{transform:translateY(-1px)}
</style>
</head>
<body>

<!-- 验证门 -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.2 19.2 6v5.4c0 4.3-3 8.2-7.2 9.4-4.2-1.2-7.2-5.1-7.2-9.4V6L12 3.2Z" fill="#fff"/></svg>
    </div>
    <h1>请完成人机验证</h1>
    <p>验证通过后即可进入转盘</p>
    <div class="ts-wrap" id="tsWrap">
      <div class="cf-turnstile"
           data-sitekey="0x4AAAAAAGBkzGCJCGI7dKxC"
           data-theme="light"
           data-language="zh-cn"
           data-size="normal"
           data-callback="onTsOk"
           data-error-callback="onTsErr"
           data-expired-callback="onTsExpired"></div>
    </div>
    <div class="gate-status" id="gateStatus">正在加载验证组件…</div>
  </div>
</div>

<!-- 抽奖主体 -->
<div class="shell app" id="app" aria-hidden="true">
  <header>
    <h1 class="title">今天吃什么<em>？</em></h1>
    <p class="sub">转盘说了算，抽到哪家就吃哪家</p>
  </header>

  <div class="card">
    <button class="mute" id="mute" title="静音/开启音效" aria-label="静音切换">
      <svg id="muteIcon" viewBox="0 0 24 24" fill="none"><path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 8.6a4.6 4.6 0 0 1 0 6.8M18.6 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>

    <div class="wheelbox">
      <div class="pointer"></div>
      <svg id="wheel" viewBox="0 0 320 320" role="img" aria-label="吃什么转盘">
        <g id="slices"></g>
        <g id="labels"></g>
      </svg>
      <div class="hub">抽</div>
    </div>

    <button class="spin" id="spin">
      <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="12" r="3.4" stroke="currentColor" stroke-width="1.9"/></svg>
      <span class="dots"><i></i><i></i><i></i></span>
      <span id="spinLabel">开始抽奖</span>
    </button>
  </div>
</div>

<!-- 结果 -->
<div class="modal" id="modal">
  <div class="result">
    <img class="shock" src="shock.jpg" alt="震惊">
    <div class="k">今天就吃这个</div>
    <div class="name" id="rname">卤肉饭</div>
    <div class="hint">已抽完，不许反悔</div>
    <div class="rbtns">
      <button type="button" id="againBtn">再抽一次</button>
      <button type="button" class="primary" id="okBtn">就它了</button>
    </div>
  </div>
</div>

<script>
(function () {
  var OPTIONS = ['卤肉饭','6元快餐','二四牛腩粉','盖饭','麦德旺','得意快餐','奶茶','螺蛳粉','鱼粉'];
  var COLORS  = ['#F8DFB4','#F3CB90','#EFB873','#F6D3A5','#F0C085','#E9A968','#F9E2BC','#F4CB94','#ECB072'];
  var SEG = 360 / OPTIONS.length;
  var NS = 'http://www.w3.org/2000/svg';
  var CX = 160, CY = 160, R = 152, TEXT_R = 112;

  /* ---------- 建盘 ---------- */
  var slicesG = document.getElementById('slices');
  var labelsG = document.getElementById('labels');
  var labelEls = [];

  function pt(r, deg) {
    var a = (deg - 90) * Math.PI / 180;
    return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
  }

  OPTIONS.forEach(function (name, i) {
    var a0 = i * SEG, a1 = a0 + SEG;
    var p0 = pt(R, a0), p1 = pt(R, a1);
    var path = document.createElementNS(NS, 'path');
    path.setAttribute('d',
      'M' + CX + ',' + CY +
      ' L' + p0[0].toFixed(2) + ',' + p0[1].toFixed(2) +
      ' A' + R + ',' + R + ' 0 0 1 ' + p1[0].toFixed(2) + ',' + p1[1].toFixed(2) + ' Z');
    path.setAttribute('fill', COLORS[i]);
    path.setAttribute('stroke', '#fffdf9');
    path.setAttribute('stroke-width', '1.4');
    slicesG.appendChild(path);

    var t = document.createElementNS(NS, 'text');
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'middle');
    t.setAttribute('font-size', name.length >= 4 ? '12.5' : '14');
    t.setAttribute('font-weight', '700');
    t.setAttribute('fill', '#4a3524');
    t.setAttribute('font-family', '-apple-system,"PingFang SC","Noto Sans SC",sans-serif');
    t.textContent = name;
    labelsG.appendChild(t);
    labelEls.push({ el: t, mid: i * SEG + SEG / 2 });
  });

  // 标签始终水平：随角度移动位置，不做旋转
  function layoutLabels(rot) {
    for (var i = 0; i < labelEls.length; i++) {
      var L = labelEls[i];
      var p = pt(TEXT_R, L.mid + rot);
      L.el.setAttribute('x', p[0].toFixed(2));
      L.el.setAttribute('y', p[1].toFixed(2));
    }
  }
  layoutLabels(0);

  /* ---------- 音效（Web Audio 合成） ---------- */
  var AC = null, muted = false, counter = 0;
  function ac() {
    if (muted) return null;
    if (!AC) {
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (AC.state === 'suspended') { AC.resume(); }
    return AC;
  }
  function tick(speed) {
    var a = ac(); if (!a) return;
    var t = a.currentTime;
    var o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
    o.type = 'square';
    var freq = 1250 + Math.min(900, speed * 260);
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 0.72, t + 0.035);
    f.type = 'bandpass'; f.frequency.value = freq * 1.1; f.Q.value = 1.2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(f); f.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + 0.06);
  }
  function win() {
    var a = ac(); if (!a) return;
    var t = a.currentTime;
    [784, 1046.5].forEach(function (freq, i) {
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle'; o.frequency.value = freq;
      var st = t + i * 0.11;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.16, st + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.34);
      o.connect(g); g.connect(a.destination);
      o.start(st); o.stop(st + 0.36);
    });
    var o2 = a.createOscillator(), g2 = a.createGain();
    o2.type = 'sine';
    var s2 = t + 0.2;
    o2.frequency.setValueAtTime(420, s2);
    o2.frequency.exponentialRampToValueAtTime(130, s2 + 0.22);
    g2.gain.setValueAtTime(0.0001, s2);
    g2.gain.exponentialRampToValueAtTime(0.14, s2 + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, s2 + 0.26);
    o2.connect(g2); g2.connect(a.destination);
    o2.start(s2); o2.stop(s2 + 0.28);
  }

  /* ---------- 静音 ---------- */
  var muteIcon = document.getElementById('muteIcon');
  document.getElementById('mute').addEventListener('click', function () {
    muted = !muted;
    muteIcon.innerHTML = muted
      ? '<path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
      : '<path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 8.6a4.6 4.6 0 0 1 0 6.8M18.6 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';
  });

  /* ---------- 验证门 ---------- */
  var gate = document.getElementById('gate');
  var app = document.getElementById('app');
  var gateStatus = document.getElementById('gateStatus');
  var tsWrap = document.getElementById('tsWrap');
  var spinBtn = document.getElementById('spin');
  var spinLabel = document.getElementById('spinLabel');
  var verified = false;

  function enter() {
    if (verified) return;
    verified = true;
    gate.classList.add('out');
    setTimeout(function () {
      gate.style.display = 'none';
      app.classList.add('in');
      app.setAttribute('aria-hidden', 'false');
      spinBtn.disabled = false;
      spinBtn.focus({ preventScroll: true });
    }, 340);
  }
  window.onTsOk = function () { gateStatus.textContent = '验证通过'; enter(); };
  window.onTsErr = function () {
    if (verified) return;
    gateStatus.textContent = '验证组件加载失败，已自动放行';
    enter();
  };
  window.onTsExpired = function () {
    if (verified) return;
    gateStatus.textContent = '验证超时，请刷新页面重试';
  };
  // 兜底：组件迟迟加载不出来就直接放行，别让人卡在门口
  setTimeout(function () {
    if (!verified) {
      gateStatus.textContent = '验证组件加载超时，已自动放行';
      enter();
    }
  }, 12000);

  /* ---------- 抽奖 ---------- */
  var modal = document.getElementById('modal');
  var rname = document.getElementById('rname');
  var rotation = 0, spinning = false, lastSlice = 0;

  function finish(idx) {
    spinning = false;
    spinBtn.classList.remove('spinning');
    spinBtn.disabled = false;
    spinLabel.textContent = '再抽一次';
    rname.textContent = OPTIONS[idx];
    modal.classList.add('on');
    try { win(); } catch (e) {}
  }

  function spin() {
    if (spinning || !verified) return;
    spinning = true;
    spinBtn.classList.add('spinning');
    spinBtn.disabled = true;
    spinLabel.textContent = '转盘转动中…';
    counter++;

    var idx = Math.floor(Math.random() * OPTIONS.length);
    var mid = idx * SEG + SEG / 2;
    var base = ((-mid) % 360 + 360) % 360;
    var current = ((rotation % 360) + 360) % 360;
    var delta = base - current;
    while (delta < 0) delta += 360;
    var turns = 4 + Math.floor(Math.random() * 2);
    var from = rotation;
    var to = rotation + delta + turns * 360;
    var dur = 4200 + Math.random() * 600;
    var start = performance.now();

    function ease(t) { return 1 - Math.pow(1 - t, 5); }

    function frame(now) {
      var t = Math.min(1, (now - start) / dur);
      var e = ease(t);
      rotation = from + (to - from) * e;
      slicesG.setAttribute('transform', 'rotate(' + rotation.toFixed(2) + ' ' + CX + ' ' + CY + ')');
      layoutLabels(rotation);

      var slice = Math.floor((((rotation % 360) + 360) % 360) / SEG);
      if (slice !== lastSlice) {
        lastSlice = slice;
        var speed = Math.abs((e - ease(Math.max(0, t - 0.02))) * (to - from));
        tick(Math.min(1, speed / 3));
      }

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        rotation = to;
        slicesG.setAttribute('transform', 'rotate(' + rotation.toFixed(2) + ' ' + CX + ' ' + CY + ')');
        layoutLabels(rotation);
        finish(idx);
      }
    }
    requestAnimationFrame(frame);
  }

  spinBtn.addEventListener('click', spin);
  document.getElementById('okBtn').addEventListener('click', function () { modal.classList.remove('on'); });
  document.getElementById('againBtn').addEventListener('click', function () {
    modal.classList.remove('on');
    setTimeout(spin, 260);
  });
  modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.remove('on'); });
})();
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
